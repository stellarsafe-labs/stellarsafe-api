name: Publish issues

# Creates a GitHub issue for each file in .github/issues/ whose title doesn't exist yet.
# Safe to re-run: existing issues (open or closed) are never duplicated or edited.

on:
  push:
    branches: [main]
    paths:
      - '.github/issues/**'
      - '.github/workflows/publish-issues.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: publish-issues
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const LABEL_COLORS = {
              'contributor-task': '0e8a16',
              'good first issue': '7057ff',
              medium: 'fbca04',
              hard: 'd93f0b',
              api: '1d76db',
              auth: '5319e7',
              indexer: '006b75',
              notifications: 'c5def5',
              security: 'b60205',
              ops: 'bfd4f2',
              tests: 'd4c5f9',
              docs: '0075ca',
            };

            const { owner, repo } = context.repo;
            const dir = '.github/issues';
            const files = fs.readdirSync(dir).filter((f) => f.endsWith('.md')).sort();

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100,
            });
            const titles = new Set(existing.filter((i) => !i.pull_request).map((i) => i.title));

            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100,
            });
            const labelNames = new Set(labels.map((l) => l.name));

            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const failed = [];
            let created = 0;
            for (const file of files) {
              const raw = fs.readFileSync(path.join(dir, file), 'utf8');
              const match = raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
              if (!match) {
                core.warning(`${file}: missing front matter, skipped`);
                continue;
              }
              const [, front, body] = match;
              const title = front.match(/^title:\s*'(.*)'\s*$/m)?.[1]?.replace(/''/g, "'");
              const labelList = (front.match(/^labels:\s*\[(.*)\]\s*$/m)?.[1] ?? '')
                .split(',')
                .map((s) => s.trim())
                .filter(Boolean);
              if (!title) {
                core.warning(`${file}: missing title, skipped`);
                continue;
              }
              if (titles.has(title)) {
                core.info(`exists: ${title}`);
                continue;
              }

              for (const name of labelList) {
                if (labelNames.has(name)) continue;
                await github.rest.issues.createLabel({
                  owner, repo, name, color: LABEL_COLORS[name] ?? 'ededed',
                });
                labelNames.add(name);
              }

              try {
                const number = await createWithRetry(title, body.trim(), labelList);
                titles.add(title);
                created++;
                core.info(`created #${number}: ${title}`);
              } catch (err) {
                failed.push(title);
                core.error(`failed: ${title}: ${err.message}`);
              }
              // GitHub asks for ~1s between content-creating requests to avoid secondary rate limits.
              await sleep(1500);
            }
            core.notice(`Created ${created} issue(s) from ${files.length} file(s).`);
            if (failed.length) core.setFailed(`${failed.length} issue(s) failed; re-run the workflow to retry.`);

            // Retries transient errors (5xx, rate limits). A 5xx can still create the issue,
            // so check for it by title before each retry to avoid duplicates.
            async function createWithRetry(title, body, labels) {
              for (let attempt = 1; ; attempt++) {
                try {
                  const { data } = await github.rest.issues.create({ owner, repo, title, body, labels });
                  return data.number;
                } catch (err) {
                  const retryable = err.status >= 500 || err.status === 403 || err.status === 429;
                  if (!retryable || attempt >= 5) throw err;
                  const wait = 5000 * 2 ** (attempt - 1);
                  core.warning(`attempt ${attempt} for "${title}" got ${err.status}; retrying in ${wait / 1000}s`);
                  await sleep(wait);
                  const { data: recent } = await github.rest.issues.listForRepo({
                    owner, repo, state: 'all', sort: 'created', direction: 'desc', per_page: 50,
                  });
                  const hit = recent.find((i) => !i.pull_request && i.title === title);
                  if (hit) return hit.number;
                }
              }
            }
