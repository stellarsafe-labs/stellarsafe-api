name: Contributor task
description: A scoped task with acceptance criteria
labels: [contributor-task]
body:
  - type: textarea
    id: goal
    attributes: { label: Goal, description: What should be possible once this is done? }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Behaviour ...
        - [ ] Integration tests cover success and failure paths
        - [ ] `openapi.json` regenerated (if the API changed)
        - [ ] Docs updated
    validations: { required: true }
  - type: textarea
    id: pointers
    attributes: { label: Pointers, description: Relevant files and design notes. }
